[package]
name = "ytdeck-mcp"
version = "1.0.0"
edition = "2021"
authors = ["Shival Gupta"]
description = "Standalone Model Context Protocol (MCP) server for yt-dlp"
license = "MIT"

[lib]
name = "ytdeck_mcp"
path = "src/lib.rs"

[[bin]]
name = "ytdeck-mcp"
path = "src/main.rs"


[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }
axum = { version = "0.7", features = ["tokio"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
